name: Android candidate
on:
  push:
    branches: ['main']
    paths: ['android/**', '*.py', 'tools/**', 'tests/**', 'requirements*.txt', 'Dockerfile', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '*.py', 'tools/**', 'tests/**', 'requirements*.txt', 'Dockerfile', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_text_encoding.py
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest testPublicPreviewUnitTest lintDebug lintPublicPreview assembleDebug assemblePublicPreview bundleRelease assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/publicPreview/*.apk
            android/app/build/outputs/bundle/release/*.aab
